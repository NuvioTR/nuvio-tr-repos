name: "Yeni Depo"
description: "Yeni bir Katalog, Kolleksiyon veya Eklenti deposu ekleyin. İlgili JSON'u düzenleyip gönderin."
title: "Yeni Depo: "
labels: ["yeni-depo"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Yeni Depo Ekleme
        Aşağıdaki alanlardan eklemek istediklerinizi **düzenleyerek** gönderin.
        Kullanmak istemediğiniz alanları olduğu gibi bırakabilir veya içeriğini temizleyebilirsiniz.

  - type: textarea
    id: katalog
    attributes:
      label: "Katalog"
      description: "Katalog JSON'unu düzenleyin."
      render: json
      value: |
        {
          "id": "catalog-test",
          "name": "TestKatalog",
          "authors": ["test"],
          "description": "Test Kataloğu",
          "repoUrl": "https://github.com/test",
          "iconUrl": "",
          "manifestUrl": "https://katalog.test.com/manifest.json",
          "dependencies": []
        }
    validations:
      required: false

  - type: textarea
    id: kolleksiyon
    attributes:
      label: "Kolleksiyon"
      description: "Koleksiyon JSON'unu düzenleyin."
      render: json
      value: |
        {
          "id": "collection-test",
          "name": "Test Koleksiyon",
          "authors": ["test"],
          "description": "Test Koleksiyonu.",
          "repoUrl": "https://github.com/test",
          "iconUrl": "",
          "collectionUrl": "https://raw.githubusercontent.com/test/nuvio/refs/heads/main/collections.json"
        }
    validations:
      required: false

  - type: textarea
    id: eklenti
    attributes:
      label: "Eklenti"
      description: "Eklenti JSON'unu düzenleyin."
      render: json
      value: |
        {
          "id": "plugin-test",
          "name": "Test Nuvio Eklentileri",
          "authors": ["test"],
          "description": "Test amaçlı katalog, arama ve yorum desteği sağlayan eklentiler.",
          "repoUrl": "https://github.com/test/nuvio-test-plugins",
          "iconUrl": "https://avatars.githubusercontent.com/u/000000000?s=200&v=4",
          "manifestUrl": "https://raw.githubusercontent.com/test/nuvio-test-plugins/refs/heads/main/manifest.json",
          "supports": {
            "stream": true,
            "catalog": true,
            "search": true,
            "comments": true
          }
        }
    validations:
      required: false